name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests (coverage floor is a ratchet — raise it as coverage grows)
        run: uv run pytest --cov=src/job_agent --cov-fail-under=64 -q
