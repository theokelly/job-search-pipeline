    preferred: scale_up
    weight: medium
    stance:
      scale_up_mid_size: preferred
      large_tech: open
      small_company: open_if_title_leverage
      early_stage: only_senior_ai_title
    rationale: 'Changed present-10: the move is done, so relocation support and the
      30% ruling no longer favor large tech. Title leverage and AI-centrality of the
      role now matter more than company size.'
  ai_posture:
    preferred: actively_investing
