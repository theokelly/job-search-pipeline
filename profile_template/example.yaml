prescreen:
  persona: 'The candidate is Your Name: Analytics & AI leader and former Chief of
    Staff

    (C-suite, $300M PE-backed company), now based in Amsterdam (moved present) and

    employed. He holds EU citizenship (Greek). He targets senior roles where AI is

    core to the remit (Head of AI, AI Transformation Lead, Head of Data & AI) and,

    secondarily, senior analytics / data / Chief of Staff / strategy roles.

    '
  geography_rules: "Geography: yourname lives in Amsterdam and does not want to relocate\
    \ or commute far. Acceptable:\n- On-site or hybrid within Amsterdam commuting\
    \ range (Amsterdam, Amstelveen, Schiphol/Hoofddorp,\n  Haarlem, Almere, Zaandam,\
    \ Utrecht, Hilversum)\n- Remote roles he can do from Amsterdam: remote-EMEA, remote-Europe,\
    \ remote-EU, or remote-NL\n\nREJECT on location if:\n- The role is on-site or\
    \ hybrid anywhere else (e.g. London, Berlin, Dublin, Rotterdam, The Hague,\n \
    \ Eindhoven), unless the JD clearly offers a remote option open to someone based\
    \ in the Netherlands\n- The role is remote but restricted to residents of another\
    \ country (e.g. \"UK-based only\",\n  \"must be located in Germany\", US time\
    \ zones). yourname has no UK right to work.\nIf the location is just \"Netherlands\"\
    \ or unclear, APPROVE and let full scoring decide.\n"
  reject_signals:
  - Dutch language fluency is explicitly required
  - Fluency in German, French, or any other non-English language is explicitly required
  - On-site or hybrid outside Amsterdam commuting range with no remote option for
    NL residents
  - Remote role restricted to residents of a country other than the Netherlands
  - Pure software engineering or production coding role (not leadership/strategy/analytics)
