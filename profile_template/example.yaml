target_roles:
- priority: 1
  category: senior_ai_leadership
  description: AI is the core of the remit and the title carries weight
  example_titles:
  - Head of AI
  - Head of AI Transformation / AI Transformation Lead
  - Head of AI Adoption / AI Enablement Lead
  - Director / VP of AI
  - Head of Data & AI / Director of Data & AI
  rationale: Direct continuation of the FB Solutions AI adoption program, at organizational
    scale, with a title that compounds for the next move.
- priority: 2
  category: senior_data_strategy_leadership
  description: Senior data, analytics, or strategy leadership, ideally with an AI
    component
  example_titles:
  - Head of Analytics
  - VP / Director of Data
  - Chief of Staff (stronger if it carries an AI transformation mandate)
  - Head of Strategy & Operations
  rationale: 'Still a credible, strong-fit path. AI-core plus a significant title
    is a soft preference, not a gate: a strong role here can still be Strong Fit.'
- priority: 3
  category: ai_consulting
  description: AI consulting / AI practice roles at lead or principal level
  example_titles:
  - Principal / Lead, AI Practice
  - AI Transformation Consultant (senior)
  rationale: Fits the adoption playbook. Internal roles preferred over consulting
    firms.
not_targeting:
- Pure engineering / SWE / production code roles
- Early-stage startup roles (pre-seed / seed / Series A) unless the title is a senior
  AI leadership role with real scope
- Roles requiring Dutch fluency
- Pure data science / ML research roles
seniority:
  current_level: C-suite member (1 of 5) at $300M PE-backed business; Chief of Staff
  ideal_target: At or above current level, with a title that signals AI leadership
  willing_to_step_down: modest
  step_down_conditions: Modest step-down in scope acceptable if (a) AI is at the core
    of the remit, (b) the title still carries weight externally (Head / Lead / Director),
    or (c) the company is a top-priority AI-forward employer. Relocation support is
    no longer a factor.
company_preferences:
