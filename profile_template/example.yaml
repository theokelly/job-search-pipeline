scoring:
  skill_fit_signals:
    strong_positive:
    - Data infrastructure (warehouse, ETL, BI) ownership
    - AI / LLM adoption program design or execution
    - Cross-functional analytics leadership
    - Executive communication / board reporting
    - Snowflake, dbt, Power BI, SQL, Python
    positive:
    - Strategy & operations / Chief of Staff scope
    - Vendor management / RFPs
    - M&A / business development infrastructure
    - Change management
    neutral:
    - Specific industry (unless explicitly listed in 'avoid')
    negative:
    - Production engineering / SWE focus
    - Pure ML research / model training focus
    - Heavy individual-contributor coding requirement without leadership scope
    blocking:
    - Dutch language fluency required
    - Sponsorship-only role outside EU work auth
    - On-site or hybrid outside Amsterdam commuting range (e.g. London, Berlin, Rotterdam)
      with no remote option
    - Remote role restricted to residents of a non-NL country (e.g. UK-only, Germany-only)
  preference_alignment_signals:
    strong_positive:
    - 'AI is core to the role''s remit: owns AI strategy, adoption, transformation,
      enablement, or an AI platform/program'
    - 'Significant title with external weight: Head of / Director / VP / Lead of AI,
      AI Transformation, Data & AI'
    - Executive-adjacent or strategic scope (reports to or works directly with C-suite)
    - Company actively investing in AI (AI in product or operations, dedicated AI
      teams)
    - English-language work environment
    positive:
    - Mid-size company or scale-up where the role carries major title leverage and
      ownership
    - Amsterdam-based (on-site or hybrid within commuting range)
    - Remote within EMEA, workable from Amsterdam
    - Senior data / analytics / Chief of Staff leadership even without an explicit
      AI mandate
    - Large tech company (neutral-to-positive; no longer a strong preference)
    negative:
    - Title or level clearly below Head / Lead / Director with no path to AI leadership
    - AI mentioned only as buzzword; role is BAU reporting or analytics maintenance
    - Pure consulting (acceptable but lower priority than internal roles)
    - Early-stage startup (seed / Series A) unless the role is a senior AI leadership
      title with real scope
  honesty_calibration:
  - Be rigorous about gaps. True ML / model training and specific industry depth outside
    tech/F&B/pharma are real gaps to acknowledge.
  - Do not paper over experience gaps with manufactured connections.
  - A role whose primary function is dedicated customer/marketing analytics (e.g.,
    5+ years of customer analytics required, CRM/loyalty analytics as the sole deliverable)
    should not score Strong Fit when that domain is absent from the candidate's background.
    However, a strategy-and-analytics role that includes customer analytics as one
    dimension among strategic framing, AI implementation, and cross-functional influence
    is NOT equivalent — assess the whole role.
  - Strong Fit should be reserved for roles where (a) the user can credibly do the
    job on day one, and (b) the role matches stated preferences.
  - 'BI tool equivalence: Power BI, Tableau, Qlik, Spotfire, and Looker are semantically
    equivalent for scoring. Experience with any one transfers to the others — do not
    penalize for tool mismatch within this family.'
  tier_definitions:
    Strong Fit: User can credibly do the job and the role aligns with preferences.
      Worth a tailored application and follow-up effort.
    Worth Reviewing: Clear skill fit OR clear preference fit, but not both. Apply
      with templated materials if friction is low.
    Long Shot: Some relevant overlap but meaningful gaps. Skip unless the company
      is a top-priority target or the role is unusually compelling.
    Skip: Skill fit weak AND preference alignment weak. Or dealbreaker present.
