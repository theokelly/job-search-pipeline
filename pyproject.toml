[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "sqlmodel==0.0.22",
    "sqlalchemy<2.1",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "python-pptx>=1.0.0",
]

[project.scripts]
job-agent = "job_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.9",
]

# Lint: pyflakes rules only (unused imports/names, undefined names).
# Deliberately no formatter and no style rules — see
# docs/refactor-audit-2026-11-24.md (Phase B).
[tool.ruff.lint]
select = ["F"]

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "fixture-scope"
